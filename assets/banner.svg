<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#374151" opacity="0.8" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .glow-circle {
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .floating-card {
      animation: floatCard 7s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 20s linear infinite;
    }
    .data-dot {
      animation: blinkDot 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
      100% { transform: scale(0.95) translate(-15px, 10px); opacity: 0.4; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -200; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs -->
  <g>
    <circle class="glow-circle" cx="200" cy="120" r="160" fill="url(#glowGrad1)" filter="url(#softGlow)" />
    <circle class="glow-circle" cx="1020" cy="280" r="180" fill="url(#glowGrad2)" filter="url(#softGlow)" style="animation-delay: -3s;" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Background Dynamic Flow Lines & Visual Architecture Nodes -->
  <g opacity="0.45">
    <path class="flow-line" d="M 120 340 C 300 340, 400 290, 600 310 S 900 370, 1080 330" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 150 90 C 350 70, 550 130, 750 90 S 1000 130, 1100 80" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Interactive / Modern Feature Badges (Background Accents) -->
  <g class="floating-card" opacity="0.85">
    <!-- Mini Metric Chip Left -->
    <rect x="80" y="55" width="170" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="98" cy="72" r="5" fill="#38bdf8" class="data-dot" />
    <text x="112" y="77" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 Cloud &amp; Notebooks</text>

    <!-- Mini Metric Chip Right -->
    <rect x="940" y="55" width="180" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="958" cy="72" r="5" fill="#a855f7" class="data-dot" style="animation-delay: -1.5s;" />
    <text x="972" y="77" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Modern Data Stack</text>
  </g>

  <!-- Foreground Header Content (Guaranteed Unobscured) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="475" y="60" width="250" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="600" y="81" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM ⚡</text>

    <!-- Main Title -->
    <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome Data Workspace
    </text>

    <!-- Subtitle with Gradient Accent -->
    <text x="600" y="215" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.2">
      Collaborative Analytics • Cloud Notebooks • Open-Source Data Platforms
    </text>

    <!-- Tagline / Description -->
    <text x="600" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Enterprise SaaS benchmarks, exact unit economics, verified free limits &amp; starred open-source engines
    </text>

    <!-- Key Ecosystem Badges (Pills) -->
    <g transform="translate(600, 315)">
      <!-- Pill 1: SaaS Benchmarks -->
      <g transform="translate(-290, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#131d31" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🏢 SaaS &amp; Unit Economics</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#131d31" stroke="#a855f7" stroke-width="1.2" />
        <text x="0" y="5" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⭐ Open-Source Alternatives</text>
      </g>

      <!-- Pill 3: Lakehouses & BI -->
      <g transform="translate(290, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#131d31" stroke="#10b981" stroke-width="1.2" />
        <text x="0" y="5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🚀 BI &amp; Interactive Notebooks</text>
      </g>
    </g>

    <!-- Decorative Bottom Accent Bar -->
    <rect x="420" y="380" width="360" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
